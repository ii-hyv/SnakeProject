<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
    //    let food = { x: 15, y: 15 };


        let newFood;

        do {
            newFood = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        } while (snake.some(segment =>
            segment.x === newFood.x && segment.y === newFood.y
        ));

        food = newFood;



        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        // käärmeen pää snake[0] on käärmeen pää, snake[1] on käärmeen toinen segmentti jne.

    document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowUp") {
            direction = { x: 0, y: -1 };
        } else if (event.key === "ArrowDown") {
            direction = { x: 0, y: 1 };
        }
        else if (event.key === "ArrowLeft") {
            direction = { x: -1, y: 0 };
        } else if (event.key === "ArrowRight") {
            direction = { x: 1, y: 0 };
        }
    });






    setInterval(() => {

        snake.unshift({ x: snake[0].x + direction.x, y: snake[0].y + direction.y }); // Add a new head based on the current direction
        //snake.pop(); // Remove the last segment to keep the snake the same length
        let ateFood = false;

        if (snake[0].x === food.x && snake[0].y === food.y) {
            ateFood = true;
            score++;
            document.getElementById("info").innerText = "Score: " + score;
            food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
        
        }

        if (!ateFood) {
        snake.pop();
        }


        console.log("Snake head position:", snake[0].x, snake[0].y);
        drawGame();


    }, 150);





        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
