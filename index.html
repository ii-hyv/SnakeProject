<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="restartButton" type="button">Restart game</button>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
    //    let food = { x: 15, y: 15 };
        let turnQueued = false;


        const createFood = () => {
            let newFood;

        const freeCells = [];

        for (let x = 0; x < tileCount; x++) {
            for (let y = 0; y < tileCount; y++) {
                const occupied = snake.some(segment =>
                    segment.x === x && segment.y === y
                );

                if (!occupied) {
                    freeCells.push({ x, y });
                }
            }
        }

        if (freeCells.length === 0) {
            return null; // No space left for food
        }

        const randomIndex = Math.floor(Math.random() * freeCells.length);
        return freeCells[randomIndex];

            return newFood;
        };

        let food = createFood();



        let score = 0;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        drawGame();

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        // käärmeen pää snake[0] on käärmeen pää, snake[1] on käärmeen toinen segmentti jne.

    document.addEventListener("keydown", (event) => {
        let requestedDirection;
                if (turnQueued) {
            return;
        }
        if (event.key === "ArrowUp") {
            requestedDirection = { x: 0, y: -1 };
        } else if (event.key === "ArrowDown") {
            requestedDirection = { x: 0, y: 1 };
        }
        else if (event.key === "ArrowLeft") {
            requestedDirection = { x: -1, y: 0 };
        } else if (event.key === "ArrowRight") {
            requestedDirection = { x: 1, y: 0 };
        }

        const isReverse =
            requestedDirection.x === -direction.x &&
            requestedDirection.y === -direction.y;

        if (!isReverse) {
            nextDirection = requestedDirection;
            turnQueued = true;
        }

        }        
    );


    let gameInterval;

    const moveSnake = () => {

        direction = nextDirection;
        turnQueued = false;

        

        const nextHead = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
        };

        const ateFood = nextHead.x === food.x && nextHead.y === food.y;
        const bodyToCheck = ateFood ? snake.slice(1) : snake.slice(1, -1);

        const hitsWall = nextHead.x < 0 || nextHead.x >= tileCount ||
            nextHead.y < 0 || nextHead.y >= tileCount;
        const hitsBody = bodyToCheck.some(segment =>
            segment.x === nextHead.x && segment.y === nextHead.y
        );

        if (hitsWall || hitsBody) {
            clearInterval(gameInterval);
            document.getElementById("info").innerText = "Game over! Score: " + score;
            return;
        }

        snake.unshift(nextHead);

        if (ateFood) {
            score++;
            document.getElementById("info").innerText = "Score: " + score;

            food = createFood();
        }
        

        if (!ateFood) {
        snake.pop();
        }


        console.log("Snake head position:", snake[0].x, snake[0].y);
        drawGame();
    };

    const startGame = () => {
        gameInterval = setInterval(moveSnake, 150);
    };

    document.getElementById("restartButton").addEventListener("click", () => {
        clearInterval(gameInterval);
        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        score = 0;
        food = createFood();
        document.getElementById("info").innerText = "Score: " + score;
        drawGame();
        startGame();
    });

    startGame();





        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
